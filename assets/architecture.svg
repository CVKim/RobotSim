<text x="372" y="341" font-size="11.5" fill="#374151">드리프트 감시 (정적 배경)</text>
<rect x="577" y="250" width="205" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
