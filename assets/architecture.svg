<text x="587" y="341" font-size="11.5" fill="#374151">pytest 51 (46개 합성만으로)</text>
<rect x="350" y="430" width="440" height="140" rx="9" fill="#eef5ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="362" y="451" font-size="13" font-weight="700" fill="#1d4ed8">ROS2 Humble (WSL2)  노드 3개: 인식 · 대차 · 제어 — 신규</text>
<text x="362" y="476" font-size="12" fill="#1f2937">perception_node: /tof/points · pick_poses · TF base_link → tof_optical (정적)</text>
<text x="362" y="495" font-size="12" fill="#1f2937">pick_executor: pick_poses → /robot/target_poses 3점 + 재촬영 Trigger 사이클</text>
<text x="362" y="514" font-size="12" fill="#1f2937">cart_node: /cart/hook_pose · TF tof_optical → cart (동적, 대차 구조물에서 추정)</text>
<text x="362" y="533" font-size="12" fill="#1f2937">status JSON · /diagnostics · rviz2 · launch · 합성 소스 · colcon test 25</text>
