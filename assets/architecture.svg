<text x="362" y="81" font-size="13" font-weight="700" fill="#1f2937">인식 패키지  robotsim_perception  (numpy / opencv)</text>
<rect x="362" y="95" width="205" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="372" y="114" font-size="12.5" font-weight="700" fill="#111827">geometry.py — 검출</text>
<text x="372" y="135" font-size="11.5" fill="#374151">층 깊이 히스토그램</text>
<text x="372" y="152" font-size="11.5" fill="#374151">I-채널 에지로 이음새 분리</text>
