<text x="372" y="186" font-size="11.5" fill="#374151">v2 격자 보완·층 선택 → 167/167</text>
<rect x="577" y="95" width="205" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
