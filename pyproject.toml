[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robotsim-perception"
version = "0.1.0"
description = "ToF bin-picking perception: top-layer detection, box top-face measurement, pick-order planning (numpy/opencv only)"
readme = "docs/40_패키지_사용법.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "tifffile>=2023.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
robotsim-perception = "robotsim_perception.__main__:main"

[tool.setuptools]
packages = ["robotsim_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:.*coercing.*:UserWarning",
]
